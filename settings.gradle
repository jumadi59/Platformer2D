pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        if (providers.gradleProperty('USE_MAVEN_LOCAL').orNull?.toBoolean()) {
            mavenLocal()
        }
        google()
        mavenCentral()
    }
}

rootProject.name = "Platformer2D"
include ':game-shared'
include ':game-desktop'
include ':game-android'
